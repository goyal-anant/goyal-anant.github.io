<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body class="layout-{{ page.layout }}">
  <header class="site-header">
    <a class="site-mark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    {% include clock.html %}
    <div class="nav-row">
      {% include nav.html %}
      {% include search-toggle.html %}
      {% include theme-toggle.html %}
    </div>
  </header>
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/clock.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/music.js' | relative_url }}"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lunr.js/2.3.9/lunr.min.js"></script>
  <script src="{{ '/assets/js/search.js' | relative_url }}"></script>
</body>
</html>
