---
layout: default
---
<article class="post">
  {% comment %} read time: body text only (footnote references, <figure> charts and "*Figure N. ...*" captions excluded), at 200 words a minute {% endcomment %}
  {% assign body = content | split: '<div class="footnotes"' | first %}
  {% assign parts = body | split: '<figure' %}
  {% assign body = parts | first %}
  {% for part in parts offset: 1 %}{% assign fig = part | split: '</figure>' | first %}{% assign rest = part | remove_first: fig %}{% assign body = body | append: rest %}{% endfor %}
  {% assign parts = body | split: '<p><em>Figure ' %}
  {% assign body = parts | first %}
  {% for part in parts offset: 1 %}{% assign cap = part | split: '</p>' | first %}{% assign rest = part | remove_first: cap %}{% assign body = body | append: rest %}{% endfor %}
  {% assign words = body | strip_html | number_of_words %}
  {% assign minutes = words | divided_by: 200.0 | ceil %}
  <p class="post-date">{{ page.date | date: "%d %b %Y" }} <span class="post-readtime">&middot; {{ minutes }} {% include t.html en="min read" hi="मिनट" %}</span></p>
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
  {% comment %} share sits after the body, before the "---" + "## References" block if the post has one, else before the footnotes {% endcomment %}
  {% capture tail %}<hr />

<h2 id="references"{% endcapture %}
  {% unless content contains tail %}{% assign tail = '<div class="footnotes"' %}{% endunless %}
  {% assign main = content | split: tail %}
  {{ main | first }}
  {% if site.reactions_url and site.reactions_url != "" %}
  {% comment %} stays hidden until the counts load, so readers never see dead buttons if the Worker is down {% endcomment %}
  <div id="reactions" data-api="{{ site.reactions_url }}" data-post="{{ page.url }}" hidden>
    <button type="button" data-kind="like" aria-pressed="false" aria-label="Like"><span aria-hidden="true">👍</span><span class="count"></span></button>
    <button type="button" data-kind="heart" aria-pressed="false" aria-label="Love"><span aria-hidden="true">❤️</span><span class="count"></span></button>
    <button type="button" data-kind="insightful" aria-pressed="false" aria-label="Insightful"><span aria-hidden="true">💡</span><span class="count"></span></button>
  </div>
  {% endif %}
  <button id="share" type="button" data-url="{{ page.url | absolute_url }}" data-title="{{ page.title | escape }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M8 11H6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-2"></path>
    </svg>
    <span aria-live="polite">{% include t.html en="Share" hi="शेयर करें" %}</span>
  </button>
  <a id="reply" href="mailto:anantnug@gmail.com?subject={{ 'Re: ' | append: page.title | url_encode | replace: '+', '%20' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="1"></rect>
      <path d="m3 7 9 6 9-6"></path>
    </svg>
    <span>{% include t.html en="Reply by email" hi="ईमेल से जवाब दें" %}</span>
  </a>
  {% if main.size > 1 %}{{ tail }}{{ main | last }}{% endif %}
</article>
<script>
  // share sheet where the browser has one, otherwise copy the public link
  (function () {
    var btn = document.getElementById('share');
    var label = btn.querySelector('span');
    var data = { title: btn.dataset.title, url: btn.dataset.url };
    btn.addEventListener('click', function () {
      if (navigator.share) return navigator.share(data).catch(function () {});
      navigator.clipboard.writeText(data.url).then(function () {
        var idle = label.innerHTML;
        label.textContent = document.documentElement.getAttribute('data-lang') === 'hi' ? 'लिंक कॉपी हो गया' : 'Link copied';
        setTimeout(function () { label.innerHTML = idle; }, 2000);
      });
    });
  })();
  // reactions: one per kind per browser (remembered in localStorage), counts shown only above zero
  (function () {
    var box = document.getElementById('reactions');
    if (!box) return;
    var endpoint = box.dataset.api + '?post=' + encodeURIComponent(box.dataset.post);
    var key = 'reacted:' + box.dataset.post;
    var mine;
    try { mine = JSON.parse(localStorage.getItem(key)) || []; } catch (e) { mine = []; }
    function show(counts) {
      box.querySelectorAll('button').forEach(function (b) {
        var n = counts[b.dataset.kind] || 0;
        b.querySelector('.count').textContent = n > 0 ? n : '';
        b.setAttribute('aria-pressed', mine.indexOf(b.dataset.kind) >= 0);
        b.setAttribute('aria-label', b.getAttribute('aria-label').replace(/ \(\d+\)$/, '') + (n > 0 ? ' (' + n + ')' : ''));
      });
    }
    fetch(endpoint).then(function (r) { return r.ok ? r.json() : Promise.reject(); }).then(function (counts) {
      show(counts);
      box.hidden = false;
    }).catch(function () {});
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b || mine.indexOf(b.dataset.kind) >= 0) return;
      mine.push(b.dataset.kind);
      try { localStorage.setItem(key, JSON.stringify(mine)); } catch (e) {}
      b.setAttribute('aria-pressed', 'true');
      fetch(endpoint + '&kind=' + b.dataset.kind, { method: 'POST' })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(show)
        .catch(function () {});
    });
  })();
  // footnote references written back to back ([^a][^b]) get a comma between them: 22,24 not 2224
  document.querySelectorAll('sup[role="doc-noteref"]').forEach(function (s) {
    var p = s.previousSibling;
    if (p && p.nodeName === 'SUP' && p.matches('[role="doc-noteref"]')) {
      s.insertAdjacentHTML('beforebegin', '<sup>,</sup>');
    }
  });
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
