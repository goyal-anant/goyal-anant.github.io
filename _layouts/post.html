---
layout: default
---
<article class="post">
  <p class="post-date">{{ page.date | date: "%d %b %Y" }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
  {{ content }}
</article>
<button id="to-top" type="button" aria-label="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"></path>
  </svg>
</button>
<script>
  (function () {
    var btn = document.getElementById('to-top');
    var reduce = matchMedia('(prefers-reduced-motion: reduce)');
    function update() { btn.classList.toggle('show', scrollY > innerHeight); }
    addEventListener('scroll', update, { passive: true });
    update();
    btn.addEventListener('click', function () {
      scrollTo({ top: 0, behavior: reduce.matches ? 'auto' : 'smooth' });
    });
  })();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
