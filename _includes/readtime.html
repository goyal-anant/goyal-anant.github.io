{% comment %}
  Read time of include.html in minutes, at 200 words a minute. Only the prose counts: the footnotes,
  <figure> charts, "*Figure N. ...*" / "*चित्र N. ...*" captions, widgets wrapped in <!--noread--> ... <!--/noread-->
  (every include in a post must be a <figure> or carry those markers) and any Liquid tag left as text are all left out.
  The post layout passes the finished body and the "Keep reading" cards pass the post's Markdown, which may not be
  rendered yet; this rule gives the same number for both. bin/check-readtime checks that they match.
{% endcomment %}{% assign body = include.html | split: '<div class="footnotes"' | first %}{% assign parts = body | split: '<!--noread-->' %}{% assign body = parts | first %}{% for part in parts offset: 1 %}{% assign w = part | split: '<!--/noread-->' | first %}{% assign rest = part | remove_first: w | remove_first: '<!--/noread-->' %}{% assign body = body | append: rest %}{% endfor %}{% capture lq_open %}{% raw %}{%{% endraw %}{% endcapture %}{% capture lq_close %}{% raw %}%}{% endraw %}{% endcapture %}{% assign parts = body | split: lq_open %}{% assign body = parts | first %}{% for part in parts offset: 1 %}{% assign tag = part | split: lq_close | first %}{% assign rest = part | remove_first: tag | remove_first: lq_close %}{% assign body = body | append: rest %}{% endfor %}{% assign parts = body | split: '<figure' %}{% assign body = parts | first %}{% for part in parts offset: 1 %}{% assign fig = part | split: '</figure>' | first %}{% assign rest = part | remove_first: fig %}{% assign body = body | append: rest %}{% endfor %}{% assign body = body | replace: '<p><em>चित्र ', '<p><em>Figure ' %}{% assign parts = body | split: '<p><em>Figure ' %}{% assign body = parts | first %}{% for part in parts offset: 1 %}{% assign cap = part | split: '</p>' | first %}{% assign rest = part | remove_first: cap %}{% assign body = body | append: rest %}{% endfor %}{% assign words = body | strip_html | number_of_words %}{{ words | divided_by: 200.0 | ceil }}
