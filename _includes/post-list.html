<ul class="post-list">
  {% for post in include.posts %}
  <li>
    <span class="post-date">{% include date.html date=post.date %}</span>
    <span class="post-sep">&raquo;</span>
    <a href="{{ post.url | relative_url }}">{% include t.html en=post.title hi=post.title_hi %}</a>
  </li>
  {% endfor %}
</ul>
