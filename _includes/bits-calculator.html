<div id="bits-calc" class="bits-calc">
  <p class="bc-title">How many facial traits does it take to tell everyone apart?</p>
  <label class="bc-slider">independent traits <input type="range" id="bc-n" min="1" max="40" value="10"> <output id="bc-n-out">10</output></label>
  <label class="bc-slider">levels you can tell apart per trait <input type="range" id="bc-k" min="2" max="10" value="3"> <output id="bc-k-out">3</output></label>
  <div class="bc-bar" aria-hidden="true"><div id="bc-fill" class="bc-fill"></div><div class="bc-need"></div></div>
  <p id="bc-result" class="bc-result" aria-live="polite"><noscript>This calculator needs JavaScript.</noscript></p>
</div>
<script src="/assets/js/bits-calculator.js" defer></script>
