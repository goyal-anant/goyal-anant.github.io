<!--noread--><figure class="ra-sheet-fig" id="fig-circuit"><svg viewBox="0 0 360 222" role="img" aria-labelledby="ra-circuit-t ra-circuit-d"><title id="ra-circuit-t">The transmitting antenna as a series circuit</title><desc id="ra-circuit-d">A generator with voltage V_g and internal impedance R_g plus jX_g drives the antenna at terminals a-b. The antenna is R_r, where power is radiated, R_L, where it turns into heat, and jX_A, which stores energy, all in series.</desc><defs><marker id="ra-circuit-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker><marker id="ra-circuit-arrow-c" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" style="fill: var(--accent)"/></marker></defs><path class="ra-fig-wire" d="M40.0,50.0 L330.0,50.0"/><path class="ra-fig-wire" d="M40.0,170.0 L330.0,170.0"/><path class="ra-fig-wire" d="M40.0,50.0 L40.0,92.0"/><path class="ra-fig-wire" d="M40.0,128.0 L40.0,170.0"/><circle class="ra-fig-part" cx="40" cy="110" r="18"/><text class="ra-fig-t" x="40.0" y="115.0" text-anchor="middle">V<tspan dy="3" font-size="0.75em">g</tspan><tspan dy="-3">​</tspan></text><rect class="ra-fig-part" x="78" y="40" width="40" height="20" rx="2"/><text class="ra-fig-t" x="98.0" y="34.0" text-anchor="middle">R<tspan dy="3" font-size="0.75em">g</tspan><tspan dy="-3">​</tspan></text><rect class="ra-fig-part" x="138" y="40" width="40" height="20" rx="2"/><text class="ra-fig-t" x="158.0" y="34.0" text-anchor="middle">jX<tspan dy="3" font-size="0.75em">g</tspan><tspan dy="-3">​</tspan></text><rect class="ra-fig-box" x="14" y="16" width="182" height="170" rx="6"/><text class="ra-fig-small" x="20.0" y="198.0" text-anchor="start">generator</text><rect class="ra-fig-box" x="214" y="16" width="140" height="170" rx="6"/><text class="ra-fig-small" x="348.0" y="198.0" text-anchor="end">antenna</text><circle class="ra-fig-node" cx="205" cy="50" r="3"/><circle class="ra-fig-node" cx="205" cy="170" r="3"/><text class="ra-fig-small" x="205.0" y="42.0" text-anchor="middle">a</text><text class="ra-fig-small" x="205.0" y="184.0" text-anchor="middle">b</text><path class="ra-fig-wire" d="M330.0,50.0 L330.0,170.0"/><rect class="ra-fig-part" x="320" y="66" width="20" height="26" rx="2"/><text class="ra-fig-t" x="312.0" y="83.0" text-anchor="end">R<tspan dy="3" font-size="0.75em">r</tspan><tspan dy="-3">​</tspan></text><text class="ra-fig-mark-t" x="252.0" y="83.0" text-anchor="end">radiated</text><rect class="ra-fig-part" x="320" y="106" width="20" height="26" rx="2"/><text class="ra-fig-t" x="312.0" y="123.0" text-anchor="end">R<tspan dy="3" font-size="0.75em">L</tspan><tspan dy="-3">​</tspan></text><text class="ra-fig-mark-t" x="252.0" y="123.0" text-anchor="end">heat</text><rect class="ra-fig-part" x="320" y="146" width="20" height="26" rx="2"/><text class="ra-fig-t" x="312.0" y="163.0" text-anchor="end">jX<tspan dy="3" font-size="0.75em">A</tspan><tspan dy="-3">​</tspan></text><text class="ra-fig-mark-t" x="252.0" y="163.0" text-anchor="end">stored</text><text class="ra-fig-small" x="98.0" y="80.0" text-anchor="middle">½|I|<tspan dy="-4" font-size="0.75em">2</tspan><tspan dy="4">​</tspan>R<tspan dy="3" font-size="0.75em">g</tspan><tspan dy="-3">​</tspan></text><text class="ra-fig-small" x="98.0" y="92.0" text-anchor="middle">heat in the generator</text><text class="ra-fig-small" x="270.0" y="213.0" text-anchor="middle">every power is ½|I|<tspan dy="-4" font-size="0.75em">2</tspan><tspan dy="4">​</tspan>R of its own resistor</text></svg><figcaption>The transmitting antenna as Balanis's series circuit. One current \(I\) flows through everything, so each resistor takes \(\tfrac12\vert I\vert^2R\): \(R_r\) radiates, \(R_L\) heats the antenna, \(R_g\) heats the generator. At conjugate match \(R_r + R_L = R_g\) and the antenna gets half. A diagram, not to scale.</figcaption></fi
