<title id="ra-map-t">How the quantities of Chapter 2 connect</title>
<desc id="ra-map-d">Far fields give the power density W; times r squared it is the intensity U; U summed over the sphere is the radiated power; U over the average gives the directivity D, and 4π over D0 is the beam solid angle. The impedance sets the reflection and radiation efficiencies, which turn D into the gain G. G0 times lambda squared over 4π is the maximum effective area. The effective area and the polarization loss factor give the Friis link, and a radar is the Friis link travelled twice. Brightness temperature weighted by the gain pattern gives the antenna temperature.</desc>
