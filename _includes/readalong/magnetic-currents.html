</svg><figcaption><em>Figure 1.</em> Three real places where a magnetic current stands in for something else. Left: the electric field across a narrow slot in a metal plate is replaced by a magnetic current along the slot, <b>M</b><sub>s</sub> = −<b>n̂</b> × <b>E</b> with the normal <b>n̂</b> facing you, Balanis eq. (12-4). Middle: the radial field in the opening of a coax feed, seen end on, becomes a ring of magnetic current, the magnetic-frill feed of eq. (8-28). Right: a small loop of electric current radiates like a magnetic current along its axis, eq. (5-21). A diagram, not to scale.</figcaption></figure><!--/noread-->
