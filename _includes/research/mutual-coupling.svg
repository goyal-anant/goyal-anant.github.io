<figure class="project-hero">
<svg class="hero-mutual-coupling" viewBox="58.0 13.0 585.0 280.0" role="img" aria-labelledby="mutual-couplingt mutual-couplingd" data-hi-aria-labelledby="mutual-couplingt-hi mutual-couplingd-hi" style="width:100%;height:auto;max-width:585px;font-family:inherit">
  <title id="mutual-couplingt">Eight dipoles inside a metal cage</title>
  <desc id="mutual-couplingd">A row of eight half-wave dipoles with spacing d inside a metal cage. Neighbouring dipoles couple directly; the cage reflects fields so distant dipoles couple too. At d = 0.2 wavelengths the gain goes from 7.99 dBi with progressive phase shift to 10.61 dBi with the cage and optimised excitations.</desc>
  <title id="mutual-couplingt-hi" lang="hi">धातु के पिंजरे में आठ डाइपोल</title>
  <desc id="mutual-couplingd-hi" lang="hi">धातु के पिंजरे के अंदर आठ हाफ़-वेव डाइपोल की एक कतार, जिनके बीच की दूरी d है। पड़ोसी डाइपोल सीधे कपल होते हैं; पिंजरा फ़ील्ड को वापस भेजता है, तो दूर वाले डाइपोल भी कपल हो जाते हैं। d = 0.2 वेवलेंथ पर गेन प्रोग्रेसिव फ़ेज़ शिफ़्ट वाले 7.99 dBi से बढ़कर, पिंजरे और ऑप्टिमाइज़ की हुई एक्साइटेशन के साथ 10.61 dBi हो जाता है।</desc>
  <style>
    .hero-mutual-coupling .flow { animation: mcflow 1.2s linear infinite; }
    .hero-mutual-coupling .pulse { animation: mcpulse 2.4s ease-in-out infinite; }
    .hero-mutual-coupling .grow { transform-box: fill-box; transform-origin: bottom; animation: mcgrow 1.1s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes mcflow { to { stroke-dashoffset: -18; } }
    @keyframes mcpulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes mcgrow { from { transform: scaleY(0); } }
    @media (prefers-reduced-motion: reduce) { .hero-mutual-coupling * { animation: none !important; } }
  </style>
