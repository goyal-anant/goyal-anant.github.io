<figure class="sat-slider" style="margin:1.5em 0">
<div style="position:relative;width:100%;aspect-ratio:1231/1140;overflow:hidden;touch-action:pan-y">
  <img src="/assets/images/dehradun/doon_2025_natural.jpg" alt="Satellite image of the Doon valley on 14 November 2025: grey built-up land covers most of the valley floor between the forested Siwalik hills in the south and the Mussoorie hills in the north" style="position:absolute;inset:0;width:100%;height:100%;display:block">
  <img class="sat-old" src="/assets/images/dehradun/doon_1989_natural.jpg" alt="The same frame on 5 December 1989: a small grey town in the middle, surrounded by fields, orchards and forest" style="position:absolute;inset:0;width:100%;height:100%;display:block;clip-path:inset(0 50% 0 0)">
  <div class="sat-line" style="position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 3px #000;pointer-events:none"></div>
  <span style="position:absolute;top:.5em;left:.6em;color:#fff;font:600 .9em sans-serif;text-shadow:0 0 4px #000">1989</span>
  <span style="position:absolute;top:.5em;right:.6em;color:#fff;font:600 .9em sans-serif;text-shadow:0 0 4px #000">2025</span>
</div>
<input type="range" min="0" max="100" value="50" aria-label="Drag to compare the Doon valley in 1989 and 2025" style="width:100%;margin-top:.5em"
  oninput="var f=this.closest('figure');f.querySelector('.sat-old').style.clipPath='inset(0 '+(100-this.value)+'% 0 0)';f.querySelector('.sat-line').style.left=this.value+'%'">
</figure>
