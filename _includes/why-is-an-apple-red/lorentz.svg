<figure>
<svg viewBox="0 0 640 320" role="img" aria-labelledby="figlort figlord" data-hi-aria-labelledby="hi-figlort-hi hi-figlord-hi" style="width:100%;height:auto;max-width:640px;font-family:inherit">
  <title id="figlort">Response of a Lorentz oscillator around its resonance</title>
  <desc id="figlord">The imaginary part of the permittivity, which means absorption, is a single peak exactly at the resonance frequency. The real part swings positive just below resonance, crosses zero at resonance, and swings negative just above it.</desc>
  <title id="figlort-hi" lang="hi">रेज़ोनेंस के आस-पास एक लॉरेंट्ज़ ऑसिलेटर का रिस्पॉन्स</title>
  <desc id="figlord-hi" lang="hi">परमिटिविटी का काल्पनिक हिस्सा, यानी एब्ज़ॉर्प्शन, ठीक रेज़ोनेंस फ़्रीक्वेंसी पर एक अकेली पीक है। वास्तविक हिस्सा रेज़ोनेंस से ठीक नीचे पॉज़िटिव जाता है, रेज़ोनेंस पर ज़ीरो पार करता है, और ठीक ऊपर नेगेटिव हो जाता है।</desc>
