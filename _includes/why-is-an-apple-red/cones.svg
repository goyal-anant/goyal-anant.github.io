      <stop offset="34%" stop-color="#00b8ff"/><stop offset="47%" stop-color="#00c800"/>
      <stop offset="59%" stop-color="#d8e800"/><stop offset="66%" stop-color="#ffb000"/>
      <stop offset="75%" stop-color="#ff4000"/><stop offset="100%" stop-color="#a00000"/>
    </linearGradient>
  </defs>
