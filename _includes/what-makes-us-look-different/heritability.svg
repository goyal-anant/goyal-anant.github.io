    <line x1="200" y1="278" x2="600" y2="278"/>
    <line x1="200.0" y1="278" x2="200.0" y2="283"/>
    <line x1="300.0" y1="278" x2="300.0" y2="283"/>
    <line x1="400.0" y1="278" x2="400.0" y2="283"/>
    <line x1="500.0" y1="278" x2="500.0" y2="283"/>
    <line x1="600.0" y1="278" x2="600.0" y2="283"/>
  </g>
  <g fill="currentColor" font-size="13" text-anchor="middle">
    <text x="200.0" y="299">0.00</text>
