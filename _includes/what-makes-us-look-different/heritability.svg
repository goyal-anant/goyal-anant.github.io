    <text x="500.0" y="299">0.75</text>
    <text x="600.0" y="299">1.00</text>
    <text x="400" y="322">heritability, h²</text>
  </g>
  <text x="190" y="34" font-size="13" fill="currentColor" text-anchor="end">forehead to base of nose</text>
