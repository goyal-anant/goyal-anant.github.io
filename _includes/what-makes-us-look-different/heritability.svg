  <text x="190" y="146" font-size="13" fill="currentColor" text-anchor="end">outer eye corners</text>
  <rect x="200" y="132" width="282.4" height="18" fill="#d0403b" fill-opacity="0.6" stroke="#d0403b"/>
  <text x="488.4" y="146" font-size="12" fill="#d0403b">0.71</text>
  <text x="190" y="174" font-size="13" fill="currentColor" text-anchor="end">jaw width</text>
  <rect x="200" y="160" width="270.8" height="18" fill="#d0403b" fill-opacity="0.6" stroke="#d0403b"/>
  <text x="476.8" y="174" font-size="12" fill="#d0403b">0.68</text>
