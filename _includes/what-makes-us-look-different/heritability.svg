  <title id="figh2t">Heritability of nine facial distances in adult female twins</title>
  <desc id="figh2d">Share of the variation between people explained by genes, from 476 pairs of twins: forehead to base of nose 0.75; cheekbone width 0.73; nose width 0.72; inner eye corners 0.71; outer eye corners 0.71; jaw width 0.68; lower face height 0.63; mouth width 0.62; nose protrusion 0.55.</desc>
