  <rect x="200" y="48" width="293.6" height="18" fill="#d0403b" fill-opacity="0.6" stroke="#d0403b"/>
  <text x="499.6" y="62" font-size="12" fill="#d0403b">0.73</text>
  <text x="190" y="90" font-size="13" fill="currentColor" text-anchor="end">nose width</text>
  <rect x="200" y="76" width="287.2" height="18" fill="#d0403b" fill-opacity="0.6" stroke="#d0403b"/>
