title: Anant Goyal
description: "Writing, research, and books."
url: "https://goyal-anant.github.io"
baseurl: ""
theme: null
private_url: "https://anantgo.pages.dev"

collections:
  rants:
    output: true
    permalink: /rant/:path/
  research:
    output: true
    permalink: /research/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: rants
    values:
      layout: post
  - scope:
      path: ""
      type: research
    values:
      layout: page

permalink: /blog/:year/:month/:day/:title/
markdown: kramdown

exclude:
  - docs/
  - lib/
  - bin/
  - .superpowers/
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
