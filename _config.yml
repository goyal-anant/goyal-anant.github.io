title: Anant Goyal
# Hindi name for the toggle. The header gives each letter its own span, and
# Liquid's split: '' would tear the vowel signs off the consonants, so the
# letters are listed here already split, one visible letter per item.
# The gap between the two words is a span of its own, hidden in English.
title_hi: अनंत गोयल
title_hi_letters: "अ|नं|त| |गो|य|ल"
description: "Writing, research, and books."
url: "https://anantnug.com"
baseurl: ""
theme: null
private_url: "https://anantgo.pages.dev"
# Cloudflare Worker for post reactions (source in worker/); leave empty to hide the buttons
reactions_url: "https://reactions.anantnug.workers.dev"

collections:
  rants:
    output: false # rants hidden for now; set true (and see rant.md, nav.html, search.json) to bring back
    permalink: /rant/:path/
  research:
    output: true
    permalink: /research/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: rants
    values:
      layout: post
  - scope:
      path: ""
      type: research
    values:
      layout: project

permalink: /blog/:year/:month/:day/:title/
markdown: kramdown

exclude:
  - docs/
  - lib/
  - worker/
  - bin/
  - .superpowers/
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTEXT.md
  - "*.command"
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Generates /sitemap.xml so search engines can find every page
plugins:
  - jekyll-sitemap
